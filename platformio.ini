[platformio]
src_dir = .

[env:weact_stm32h562vgt6]
platform = https://github.com/platformio/platform-ststm32.git
board = weact_stm32h562vgt6
framework = stm32cube

upload_protocol = dfu

platform_packages =
    framework-stm32cubeh5 @ https://github.com/samspencer5991/framework-stm32cubeh5.git

board_build.ldscript = src/linker/32CORE.ld

build_flags =
    -I src/drivers/Inc
    -I src/configs
	-I src/kernel/Inc

build_src_filter =
    +<main.cpp>
    +<src/drivers/*.c>
    +<src/drivers/*.cpp>
	+<src/kernel/*.cpp>
